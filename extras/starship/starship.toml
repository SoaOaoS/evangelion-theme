# Evangelion starship prompt — an entry plug HUD.
#
#  ╭─ 󰣇 ~/dev/nerv  main !2 ?1 +12/-3  v3.12 (.venv) ·························· 󰔟 4s  14:03
#  ├─ 󰐊 Utada — Beautiful World  󱃾 prod-eu ⚠ (magi)  nerv-admin (eu-w1)
#  ╰─ SYNC ❯
#
# Install: cp extras/starship/starship.toml ~/.config/starship.toml
#          cp extras/starship/evangelion-now-playing ~/.local/bin/   (needs playerctl)
# Colours are ANSI names, so the prompt follows the active Evangelion variant.

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 400
scan_timeout = 30

format = """
[╭─](bright-black)\
$os\
$username\
$hostname\
$container\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$python\
$nodejs\
$bun\
$deno\
$rust\
$golang\
$java\
$kotlin\
$php\
$ruby\
$lua\
$zig\
$dotnet\
$nix_shell\
$direnv\
$fill\
$status\
$cmd_duration\
$memory_usage\
$battery\
$time\
(
[├─](bright-black)\
${custom.music}\
$kubernetes\
$helm\
$aws\
$gcloud\
$azure\
$docker_context\
$terraform\
$pulumi)
[╰─](bright-black)$sudo$jobs$character"""

# Line 1: where you are + status. Line 2 (only when something is active): music and
# cloud contexts. Line 3: the prompt. No right_format: bash, Omarchy's default shell,
# has no right prompt.

[fill]
symbol = " "

# --- where am I ---------------------------------------------------------------

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold purple"

[os.symbols]
Arch = "󰣇 "
Ubuntu = " "
Debian = " "
Fedora = " "
Macos = " "
Linux = " "
NixOS = " "

[username]
format = "[$user]($style)[@](bright-black)"
style_user = "bold yellow"
style_root = "bold red"

[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
format = "[$ssh_symbol$hostname]($style) "
style = "bold yellow"

[container]
format = "[ $name]($style) "
style = "bold cyan"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
style = "bold purple"
before_repo_root_style = "purple"
repo_root_style = "bold underline purple"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "red"

[directory.substitutions]
"~/Downloads" = "󰉍 Downloads"
"~/Documents" = "󰈙 Documents"
"~/.config" = " .config"

# --- git ----------------------------------------------------------------------

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold green"
truncation_length = 32

[git_commit]
format = "[ $hash$tag]($style) "
style = "green"
tag_disabled = false
tag_symbol = " "

[git_state]
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "
style = "bold yellow"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"
conflicted = "=$count "
ahead = "↑$count "
behind = "↓$count "
diverged = "↕↑$ahead_count↓$behind_count "
untracked = "?$count "
stashed = "≡$count "
modified = "!$count "
staged = "+$count "
renamed = "»$count "
deleted = "×$count "
up_to_date = ""

[git_metrics]
disabled = false
format = "([+$added]($added_style)[/](bright-black)[-$deleted]($deleted_style) )"
added_style = "green"
deleted_style = "red"

# --- languages & envs -----------------------------------------------------------

[python]
format = "[$symbol$version( \\($virtualenv\\))]($style) "
symbol = " "
style = "yellow"
version_format = "v${major}.${minor}"

[nodejs]
format = "[$symbol$version]($style) "
symbol = " "
style = "green"
version_format = "v${major}"

[bun]
format = "[$symbol$version]($style) "
symbol = "bun "
style = "yellow"

[deno]
format = "[$symbol$version]($style) "
symbol = " "
style = "green"

[rust]
format = "[$symbol$version]($style) "
symbol = " "
style = "red"
version_format = "v${major}.${minor}"

[golang]
format = "[$symbol$version]($style) "
symbol = " "
style = "cyan"
version_format = "v${major}.${minor}"

[java]
format = "[$symbol$version]($style) "
symbol = " "
style = "red"

[kotlin]
format = "[$symbol$version]($style) "
symbol = " "
style = "purple"

[php]
format = "[$symbol$version]($style) "
symbol = " "
style = "purple"

[ruby]
format = "[$symbol$version]($style) "
symbol = " "
style = "red"

[lua]
format = "[$symbol$version]($style) "
symbol = " "
style = "blue"

[zig]
format = "[$symbol$version]($style) "
symbol = " "
style = "yellow"

[dotnet]
format = "[$symbol$version( 󰓾 $tfm)]($style) "
symbol = " "
style = "purple"

[nix_shell]
format = "[$symbol$state( $name)]($style) "
symbol = " "
style = "bold blue"

[direnv]
disabled = false
format = "[$symbol$loaded]($style) "
symbol = "󱁿 "
style = "bright-black"
allowed_msg = ""
not_allowed_msg = "blocked"
denied_msg = "denied"
loaded_msg = ""
unloaded_msg = ""

# --- what is going on (right side of line 1) ----------------------------------

[custom.music]
description = "Track playing in Spotify or any MPRIS player"
command = "evangelion-now-playing"
when = true
require_repo = false
shell = ["bash", "--noprofile", "--norc"]
format = "([$output]($style)  )"
style = "bold green"

[kubernetes]
disabled = false
format = "[$symbol$context( \\($namespace\\))]($style)  "
symbol = "󱃾 "
style = "bold blue"

# Production contexts flash in red, like a Pattern Blue alert.
[[kubernetes.contexts]]
context_pattern = "(?P<ctx>.*(prod|prd|production).*)"
style = "bold red"
context_alias = "$ctx ⚠"

[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:[\\w-]+:\\d+:cluster/(?P<cluster>[\\w-]+)"
context_alias = "eks:$cluster"

[[kubernetes.contexts]]
context_pattern = "gke_.*_(?P<cluster>[\\w-]+)"
context_alias = "gke:$cluster"

[helm]
format = "[$symbol$version]($style)  "
symbol = "󰠳 "
style = "blue"

[aws]
format = "[$symbol$profile( \\($region\\))( \\[$duration\\])]($style)  "
symbol = " "
style = "bold yellow"
expiration_symbol = "󰔟"

[aws.region_aliases]
eu-west-1 = "eu-w1"
eu-west-3 = "paris"
eu-central-1 = "eu-c1"
us-east-1 = "us-e1"
us-west-2 = "us-w2"

[gcloud]
format = "[$symbol$project( \\($region\\))]($style)  "
symbol = "󱇶 "
style = "bold blue"

[azure]
disabled = false
format = "[$symbol$subscription]($style)  "
symbol = " "
style = "bold blue"

[docker_context]
format = "[$symbol$context]($style)  "
symbol = " "
style = "bold cyan"
only_with_files = false

[terraform]
format = "[$symbol$workspace]($style)  "
symbol = "󱁢 "
style = "bold purple"

[pulumi]
format = "[$symbol$stack]($style)  "
symbol = "pulumi:"
style = "bold purple"

# --- prompt line ----------------------------------------------------------------

[sudo]
disabled = false
format = "[$symbol]($style)"
symbol = "󰌆 "
style = "bold red"

[jobs]
format = "[$symbol$number]($style) "
symbol = "󰜎 "
style = "bold cyan"

[character]
success_symbol = "[SYNC ❯](bold green)"
error_symbol = "[PATTERN BLUE ❯](bold red)"
vimcmd_symbol = "[MAGI ❮](bold yellow)"
vimcmd_replace_one_symbol = "[MAGI ❮](bold purple)"
vimcmd_replace_symbol = "[MAGI ❮](bold purple)"
vimcmd_visual_symbol = "[MAGI ❮](bold cyan)"

# --- status, end of line 1 --------------------------------------------------------

[status]
disabled = false
format = "[$symbol$common_meaning$signal_name$maybe_int]($style)  "
symbol = "󰅙 "
style = "bold red"
map_symbol = false
pipestatus = false

[cmd_duration]
min_time = 2000
format = "[󰔟 $duration]($style)  "
style = "yellow"
show_notifications = false

[memory_usage]
disabled = false
threshold = 80
format = "[$symbol$ram_pct]($style)  "
symbol = "󰍛 "
style = "bold red"

[battery]
format = "[$symbol$percentage]($style)  "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 35
style = "yellow"

[time]
disabled = false
format = "[ $time]($style) "
style = "bright-black"
time_format = "%H:%M"
