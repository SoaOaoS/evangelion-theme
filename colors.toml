# Evangelion — Omarchy 4 theme
# Unit-01 purple & green over a Tokyo-3 night, NERV warning orange,
# MAGI yellow and LCL red. Retro 90s cel-anime palette.

mode = "dark"

accent = "#8fd14f"            # Unit-01 green
selection = "#3a2a5e"         # LCL-dimmed purple
muted = "#5b4a7d"             # Entry-plug dusk

background = "#130e1f"        # Geofront night
dark_background = "#0d0916"
darker_background = "#08060e"
lighter_background = "#1f1733"

foreground = "#e8ddc7"        # Aged cel paper
dark_foreground = "#7a6a98"
light_foreground = "#cdc2dc"
bright_foreground = "#f7efdc"

red = "#e5364a"               # Unit-02 / EMERGENCY red
yellow = "#f2c12e"            # MAGI yellow
orange = "#ff8a1e"            # NERV warning orange
green = "#8fd14f"             # Unit-01 green
cyan = "#4fc6c4"              # A.T. Field / Rei
blue = "#5a7fd8"              # Pattern blue
magenta = "#9b6ad6"           # Unit-01 armour purple
brown = "#7d3b26"             # Rust of the Geofront

bright_red = "#ff5a69"
bright_yellow = "#ffd95c"
bright_green = "#b2ec74"
bright_cyan = "#7ee6e1"
bright_blue = "#86a6f2"
bright_magenta = "#c093f5"

# Window borders: Unit-01 armour → Unit-01 glow
hyprland_active_border = "rgba(9b6ad6ee) rgba(8fd14fee) 45deg"
hyprland_inactive_border = "rgba(2c2145aa)"
